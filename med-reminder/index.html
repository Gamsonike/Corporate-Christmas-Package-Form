<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Med Reminder</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#f4f7fa;color:#222}
h1{margin-top:0}
form,.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
form{display:grid;gap:8px}
input,button{font:inherit;padding:8px;border-radius:6px;border:1px solid #bbb}
button{background:#1976d2;color:#fff;border:0;cursor:pointer}
button.del{background:#c62828;padding:4px 8px}
.card{display:flex;justify-content:space-between;align-items:center;gap:8px}
.due{border-left:5px solid #c62828}.taken{opacity:.55}
small{color:#666}
#banner{display:none;background:#c62828;color:#fff;padding:10px;border-radius:8px;margin-bottom:12px}
</style>
</head>
<body>
<h1>💊 Med Reminder</h1>
<div id="banner"></div>
<form id="f">
  <input id="name" placeholder="Medication name" required maxlength="80">
  <input id="dose" placeholder="Dose (e.g. 500 mg)" maxlength="40">
  <input id="time" type="time" required>
  <button>Add reminder</button>
</form>
<div id="list"></div>
<small>Reminders fire while this page is open. Data stays in your browser only. Not medical advice.</small>
<script>
const KEY="medReminders";
let meds=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
const today=()=>new Date().toDateString();
const save=()=>{localStorage.setItem(KEY,JSON.stringify(meds));render()};
function render(){
  const list=$("list");list.textContent="";
  meds.sort((a,b)=>a.time.localeCompare(b.time)).forEach(m=>{
    const done=m.takenOn===today();
    const d=document.createElement("div");d.className="card"+(done?" taken":"");
    const info=document.createElement("div");
    const b=document.createElement("b");b.textContent=m.name;
    const s=document.createElement("small");s.textContent=` ${m.dose} · ${m.time}`;
    info.append(b,s);
    const act=document.createElement("div");
    const t=document.createElement("button");t.textContent=done?"Undo":"Taken";
    t.onclick=()=>{m.takenOn=done?null:today();save()};
    const x=document.createElement("button");x.className="del";x.textContent="✕";
    x.onclick=()=>{meds=meds.filter(o=>o!==m);save()};
    act.append(t," ",x);d.append(info,act);list.append(d);
  });
}
$("f").onsubmit=e=>{
  e.preventDefault();
  meds.push({id:Date.now(),name:$("name").value.trim(),dose:$("dose").value.trim(),time:$("time").value,takenOn:null,notified:null});
  e.target.reset();save();
  if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
};
function check(){
  const n=new Date(),hm=n.toTimeString().slice(0,5);
  meds.forEach(m=>{
    if(m.time===hm&&m.takenOn!==today()&&m.notified!==today()){
      m.notified=today();localStorage.setItem(KEY,JSON.stringify(meds));
      const msg=`Time to take ${m.name} ${m.dose}`;
      const bn=$("banner");bn.style.display="block";bn.textContent="⏰ "+msg;
      if("Notification" in window&&Notification.permission==="granted")new Notification("Med Reminder",{body:msg});
    }
  });
}
setInterval(check,15000);check();render();
</script>
</body>
</html>
